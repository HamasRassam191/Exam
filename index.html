
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ClassifAds</title>
    

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            margin: 0;

            font-family: "Inter", Arial, sans-serif;

            background: #f7fbfd;

        }


        /* =================================
           MAIN PAGE
        ================================= */

        .page {

            min-height: 100vh;

            position: relative;

            overflow: hidden;

            border-radius: 30px;

            background:

                radial-gradient(
                    circle at 5% 22%,
                    rgba(37,169,235,.22),
                    transparent 17%
                ),

                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #ffffff 52%,
                    #f2faff 100%
                );

            box-shadow:

                0 0 0 1px
                rgba(91,194,235,.25),

                0 15px 50px
                rgba(45,133,180,.12);

        }


        /* =================================
           LEFT BLUE LIGHT
        ================================= */

        .left-glow {

            position: absolute;

            width: 420px;
            height: 420px;

            left: -220px;
            top: 120px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(27,164,239,.48),
                    rgba(27,164,239,.08) 50%,
                    transparent 72%
                );

            filter: blur(25px);

            pointer-events: none;

        }


        /* =================================
           RIGHT LIGHT
        ================================= */

        .right-glow {

            position: absolute;

            width: 500px;
            height: 500px;

            right: -180px;
            bottom: -220px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(39,188,255,.15),
                    transparent 70%
                );

            filter: blur(35px);

            pointer-events: none;

        }


        /* =================================
           NAVBAR
        ================================= */

        .nav-link {

            position: relative;

            color: #5c646a;

            transition:

                color .25s ease,
                transform .25s ease;

        }


        .nav-link::after {

            content: "";

            position: absolute;

            left: 0;
            right: 0;

            bottom: -9px;

            height: 2px;

            border-radius: 10px;

            background: #0878d7;

            transform: scaleX(0);

            transform-origin: center;

            transition: .25s ease;

        }


        .nav-link:hover {

            color: #0878d7;

            transform: translateY(-1px);

        }


        .nav-link:hover::after {

            transform: scaleX(1);

        }


        .nav-link.active {

            color: #0878d7;

        }


        .nav-link.active::after {

            transform: scaleX(1);

        }


        /* =================================
           DASHBOARD
        ================================= */

        .dashboard-button {

            transition: .25s ease;

        }


        .dashboard-button:hover {

            color: #0878d7;

        }


        .dashboard-arrow {

            transition: transform .25s ease;

        }


        .dashboard-button.open
        .dashboard-arrow {

            transform: rotate(180deg);

        }


        .dashboard-menu {

            opacity: 0;

            visibility: hidden;

            transform:
                translateY(-8px)
                scale(.98);

            transition:

                opacity .2s ease,
                transform .2s ease,
                visibility .2s ease;

        }


        .dashboard-menu.open {

            opacity: 1;

            visibility: visible;

            transform:
                translateY(0)
                scale(1);

        }


        .dashboard-item {

            transition:

                background .2s ease,
                color .2s ease,
                padding-left .2s ease;

        }


        .dashboard-item:hover {

            background: #eff8ff;

            color: #0878d7;

            padding-left: 18px;

        }


        /* =================================
           LOGO
        ================================= */

        .logo-symbol {

            width: 43px;
            height: 43px;

            position: relative;

        }


        .logo-piece {

            width: 14px;
            height: 14px;

            position: absolute;

            transform: rotate(45deg);

            border-radius: 3px;

        }


        .logo-1 {

            left: 2px;
            top: 4px;

            background: #52c7e8;

        }


        .logo-2 {

            right: 2px;
            top: 4px;

            background: #208ed5;

        }


        .logo-3 {

            left: 2px;
            bottom: 4px;

            background: #1c74c8;

        }


        .logo-4 {

            right: 2px;
            bottom: 4px;

            background: #55bde1;

        }


        .logo-center {

            width: 14px;
            height: 14px;

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background: white;

            border: 3px solid #2186cf;

        }


        /* =================================
           SEARCH CONTAINER
        ================================= */

        .search-box {

            width: 100%;

            height: 65px;

            border: 3px solid #abc4d2;

            border-radius: 19px;

            background: rgba(255,255,255,.96);

            display: flex;

            align-items: center;

            padding: 0 20px;

            cursor: text;

            position: relative;

            transition:

                border-color .25s ease,
                box-shadow .25s ease,
                transform .25s ease,
                background .25s ease;

        }


        /* =================================
           SEARCH HOVER
        ================================= */

        .search-box:hover {

            border-color: #5bb8e8;

            box-shadow:

                0 0 0 4px
                rgba(8,120,215,.06),

                0 10px 25px
                rgba(8,120,215,.08);

            transform:
                translateY(-2px);

        }


        /* =================================
           SEARCH ACTIVE
        ================================= */

        .search-box.focused {

            border-color: #0878d7;

            background: #ffffff;

            box-shadow:

                0 0 0 5px
                rgba(8,120,215,.12),

                0 12px 30px
                rgba(8,120,215,.14);

            transform:
                translateY(-3px);

        }


        /* =================================
           SEARCH INPUT
        ================================= */

        .search-input {

            border: none;

            outline: none;

            background: transparent;

            font-size: 14px;

            color: #52616b;

            width: 100%;

        }


        .search-input:focus {

            color: #0878d7;

        }


        .search-input::placeholder {

            color: #9caab2;

            transition:
                color .25s ease;

        }


        .search-box.focused
        .search-input::placeholder {

            color: #0878d7;

        }


        /* =================================
           LOCATION ICON
        ================================= */

        .location-icon {

            transition:

                color .25s ease,
                transform .25s ease;

        }


        .search-box.focused
        .location-icon {

            color: #0878d7;

            transform:
                scale(1.12);

        }


        /* =================================
           SEARCH DIVIDER
        ================================= */

        .search-divider {

            transition:
                background .25s ease;

        }


        .search-box.focused
        .search-divider {

            background: #b9dff5;

        }


        /* =================================
           CATEGORY
        ================================= */

        #category {

            cursor: pointer;

            transition:
                color .25s ease;

        }


        #category:hover {

            color: #0878d7;

        }


        .search-box.focused
        #category {

            color: #52616b;

        }


        /* =================================
           SEARCH BUTTON
        ================================= */

        .search-btn {

            margin-top: 35px;

            height: 68px;

            min-width: 230px;

            padding: 0 38px;

            border: none;

            border-radius: 17px;

            background: #0878d7;

            color: white;

            font-size: 17px;

            font-weight: 500;

            cursor: pointer;

            box-shadow:

                0 10px 25px
                rgba(8,120,215,.22);

            transition:
                .25s ease;

        }


        .search-btn:hover {

            background: #056bc2;

            transform:
                translateY(-3px);

            box-shadow:

                0 15px 28px
                rgba(8,120,215,.28);

        }


        .search-btn:active {

            transform:
                translateY(0)
                scale(.98);

        }


        /* =================================
           HERO IMAGE
        ================================= */

        .hero-image {

            position: absolute;

            width: min(900px, 67vw);

            max-width: none;

            right: -35px;

            bottom: -20px;

            z-index: 5;

            object-fit: contain;

            filter:

                drop-shadow(
                    0 30px 30px
                    rgba(0,103,190,.12)
                );

            transition:

                transform .7s ease;

        }


        .hero-image:hover {

            transform:
                translateY(-8px)
                scale(1.015);

        }


        /* =================================
           LOGIN MODAL
        ================================= */

        .login-overlay {

            position: fixed;

            inset: 0;

            z-index: 100;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(5,31,51,.42);

            backdrop-filter:
                blur(7px);

            opacity: 0;

            visibility: hidden;

            transition: .25s ease;

        }


        .login-overlay.show {

            opacity: 1;

            visibility: visible;

        }


        .login-card {

            width: 100%;

            max-width: 420px;

            background: white;

            border-radius: 24px;

            padding: 32px;

            box-shadow:

                0 30px 80px
                rgba(0,60,100,.25);

            transform:
                translateY(20px)
                scale(.96);

            transition: .3s ease;

        }


        .login-overlay.show
        .login-card {

            transform:
                translateY(0)
                scale(1);

        }


        /* =================================
           MOBILE MENU
        ================================= */

        .mobile-menu {

            transform:
                translateY(-10px);

            opacity: 0;

            visibility: hidden;

            transition: .25s ease;

        }


        .mobile-menu.open {

            transform:
                translateY(0);

            opacity: 1;

            visibility: visible;

        }


        /* =================================
           RESPONSIVE
        ================================= */

        @media (max-width: 1024px) {

            .hero-image {

                width: 700px;

                right: -150px;

            }


            .hero-content {

                width: 52%;

            }


            .hero-title {

                font-size: 45px !important;

            }

        }


        @media (max-width: 768px) {

            .page {

                border-radius: 20px;

            }


            .desktop-nav {

                display: none;

            }


            .mobile-button {

                display: flex;

            }


            .hero-section {

                display: flex !important;

                flex-direction: column;

                min-height: auto !important;

                padding-top: 25px;

            }


            .hero-content {

                width: 100%;

                padding:
                    40px 25px 0;

            }


            .hero-title {

                font-size: 39px !important;

                line-height:
                    1.3 !important;

            }


            .hero-visual {

                width: 100%;

                height: 430px;

                position: relative !important;

            }


            .hero-image {

                width: 700px;

                right: -170px;

                bottom: -70px;

            }


            .search-btn {

                min-width: 190px;

                height: 60px;

            }

        }


        @media (max-width: 480px) {

            .hero-title {

                font-size: 33px !important;

            }


            .search-box {

                height: 58px;

                padding:
                    0 14px;

            }


            .search-btn {

                width: 180px;

                min-width: 0;

                font-size: 15px;

            }


            .hero-visual {

                height: 350px;

            }


            .hero-image {

                width: 590px;

                right: -180px;

                bottom: -40px;

            }

        }

    </style>

</head>


<body class="p-0 sm:p-2 lg:p-3">

<script>


/* ==========================================
   SEARCH FOCUS
========================================== */

const searchBox =
    document.getElementById("searchBox");

const locationInput =
    document.getElementById("location");


/* Focus */

locationInput.addEventListener(
    "focus",
    () => {

        searchBox.classList.add(
            "focused"
        );

    }
);


/* Blur */

locationInput.addEventListener(
    "blur",
    () => {

        searchBox.classList.remove(
            "focused"
        );

    }
);


/* Click anywhere inside */

searchBox.addEventListener(
    "click",
    () => {

        locationInput.focus();

    }
);


/* ==========================================
   DASHBOARD DROPDOWN
========================================== */

const dashboardButton =
    document.getElementById(
        "dashboardButton"
    );


const dashboardMenu =
    document.getElementById(
        "dashboardMenu"
    );


dashboardButton.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();

        dashboardButton.classList.toggle(
            "open"
        );

        dashboardMenu.classList.toggle(
            "open"
        );

    }
);


/* Close dashboard outside */

document.addEventListener(
    "click",
    (event) => {

        if (
            !dashboardButton.contains(
                event.target
            ) &&
            !dashboardMenu.contains(
                event.target
            )
        ) {

            dashboardButton.classList.remove(
                "open"
            );

            dashboardMenu.classList.remove(
                "open"
            );

        }

    }
);


/* ==========================================
   NAV ACTIVE
========================================== */

const navLinks =
    document.querySelectorAll(
        ".nav-link"
    );


navLinks.forEach(
    link => {

        link.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                navLinks.forEach(
                    item =>
                    item.classList.remove(
                        "active"
                    )
                );

                this.classList.add(
                    "active"
                );

            }
        );

    }
);


/* ==========================================
   LOGIN
========================================== */

const loginButton =
    document.getElementById(
        "loginButton"
    );


const loginOverlay =
    document.getElementById(
        "loginOverlay"
    );


const closeLogin =
    document.getElementById(
        "closeLogin"
    );


function openLogin() {

    loginOverlay.classList.add(
        "show"
    );

}


function closeLoginModal() {

    loginOverlay.classList.remove(
        "show"
    );

}


loginButton.addEventListener(
    "click",
    openLogin
);


closeLogin.addEventListener(
    "click",
    closeLoginModal
);


/* Click outside modal */

loginOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            loginOverlay
        ) {

            closeLoginModal();

        }

    }
);


/* Escape */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeLoginModal();

        }

    }
);


/* ==========================================
   LOGIN FORM
========================================== */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();

            alert(
                "Login form submitted successfully."
            );

        }
    );


/* ==========================================
   SEARCH
========================================== */

document
    .getElementById("searchButton")
    .addEventListener(
        "click",
        () => {

            const location =
                locationInput.value.trim();


            const category =
                document
                .getElementById(
                    "category"
                )
                .value;


            if (!location) {

                locationInput.focus();

                searchBox.classList.add(
                    "focused"
                );

                return;

            }


            alert(
                `Searching for ${category} in ${location}`
            );

        }
    );


/* ==========================================
   MOBILE MENU
========================================== */

const mobileButton =
    document.getElementById(
        "mobileButton"
    );


const mobileMenu =
    document.getElementById(
        "mobileMenu"
    );


mobileButton.addEventListener(
    "click",
    () => {

        mobileMenu.classList.toggle(
            "open"
        );

    }
);


/* Mobile Login */

document
    .getElementById(
        "mobileLoginButton"
    )
    .addEventListener(
        "click",
        () => {

            mobileMenu.classList.remove(
                "open"
            );

            openLogin();

        }
    );


/* ==========================================
   MOBILE NAV
========================================== */

document
    .querySelectorAll(
        "[data-mobile-nav]"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        "[data-mobile-nav]"
                    )
                    .forEach(
                        item =>
                        item.classList.remove(
                            "bg-blue-50",
                            "text-blue-600"
                        )
                    );

                button.classList.add(
                    "bg-blue-50",
                    "text-blue-600"
                );

                mobileMenu.classList.remove(
                    "open"
                );

            }
        );

    });


/* ==========================================
   LOGO INTERACTION
========================================== */

document
    .getElementById("logo")
    .addEventListener(
        "click",
        event => {

            event.preventDefault();

            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }
    );


</script>


</body>

</html>
